packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 12 asks, per dependency, whether to run its postinstall build script. Answer it explicitly
# so pnpm stops re-scaffolding this block and stops warning. esbuild works via its prebuilt platform
# binary (installed as an optional dependency), so its own build script can be skipped.
allowBuilds:
  esbuild: false
