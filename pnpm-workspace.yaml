packages:
  - 'apps/*'
  - 'packages/*'

# esbuild (pulled in by tsx) only re-checks its platform binary in its postinstall, and pnpm
# already installs that binary as an optional dependency, so skipping the build script is safe.
# Listing it here is the correct pnpm 10+ way to acknowledge that and stop the ignored-build warning.
ignoredBuiltDependencies:
  - esbuild
