packages:
  - 'apps/*'
  - 'packages/*'

# esbuild (via tsx/vite) ships a trusted postinstall that just links its platform binary.
# Approve it so pnpm runs it instead of reporting an ignored build. If this still warns,
# run `pnpm approve-builds` and approve esbuild — that writes the exact setting your pnpm needs.
onlyBuiltDependencies:
  - esbuild
